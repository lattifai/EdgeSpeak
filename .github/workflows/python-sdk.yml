name: Python SDK
on:
  push:
    paths: ['sdk/python/**', '.github/workflows/python-sdk*.yml', '.github/scripts/**']
  pull_request:
    paths: ['sdk/python/**', '.github/workflows/python-sdk*.yml', '.github/scripts/**']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
  test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build candidate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Test installed package and runnable examples (unit suite)
        run: |
          python -m pip install --pre "numpy>=1.23.5"
          python tests/run_tests.py --suite unit
      - name: Check installed public typing contract
        run: |
          python -m pip install "mypy==1.20.2" "typing_extensions>=4.6"
          python -m mypy --strict --follow-imports=silent --warn-unused-ignores tests/typing/public_api.py
      - name: Check typed request and stream implementation
        run: python -m mypy --follow-imports=silent src/edgespeak/_client.py src/edgespeak/_types.py src/edgespeak/_streaming.py src/edgespeak/_input_audio.py
