name: Publish Python SDK
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: python-sdk-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-metadata:
    if: github.repository == 'lattifai/EdgeSpeak'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Require tag and SDK versions to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/check_sdk_release.py "$RELEASE_TAG"
  tests:
    needs: release-metadata
    uses: ./.github/workflows/python-sdk.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and validate distributions
        working-directory: sdk/python
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-distributions
          path: sdk/python/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/edgespeak/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-sdk-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
